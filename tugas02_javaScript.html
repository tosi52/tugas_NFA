<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 2 - Data Pegawai</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tfoot {
            font-weight: bold;
            background-color: #e6f7ff;
        }
    </style>
</head>
<body>

    <h2>Data Gaji Pegawai</h2>

    <script>
        // 1. Deklarasi Data Pegawai
        let nama = "Dodi Prayodi";
        let umur = 25;
        let jabatan = "Manajer";
        let status = "Menikah";

        // 2. Menentukan Gaji Pokok menggunakan Struktur IF
        let gapok = 0;
        if (jabatan.toLowerCase() === "manajer") {
            gapok = 15000000;
        } else if (jabatan.toLowerCase() === "asisten manajer") {
            gapok = 10000000;
        } else if (jabatan.toLowerCase() === "staff") {
            gapok = 5000000;
        } else {
            gapok = 0;
        }

        // 3. Menhitung Tunjangan Jabatan (15%) & BPJS (10%)
        let tunjab = 0.15 * gapok;
        let bpjs = 0.10 * gapok;

        // 4. Menghitung Tunjangan Keluarga menggunakan TERNARY
        let tunkel = (status.toLowerCase() === "menikah") ? 0.20 * gapok : 0;

        // 5. Total Gaji
        let totalGaji = gapok + tunjab + bpjs + tunkel;

        // Fungsi pembantu untuk format Rupiah
        const formatRupiah = (angka) => {
            return "Rp " + angka.toLocaleString("id-ID");
        };

        // Output ke Tabel HTML
        document.write(`
            <table>
                <thead>
                    <tr>
                        <th>Nama Pegawai</th>
                        <th>Umur</th>
                        <th>Jabatan</th>
                        <th>Status</th>
                        <th>Gaji Pokok</th>
                        <th>Tunjangan Jabatan (15%)</th>
                        <th>BPJS (10%)</th>
                        <th>Tunjangan Keluarga (20%)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>${nama}</td>
                        <td>${umur} Tahun</td>
                        <td>${jabatan}</td>
                        <td>${status}</td>
                        <td>${formatRupiah(gapok)}</td>
                        <td>${formatRupiah(tunjab)}</td>
                        <td>${formatRupiah(bpjs)}</td>
                        <td>${formatRupiah(tunkel)}</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="7" style="text-align: right;">Total Gaji</td>
                        <td>${formatRupiah(totalGaji)}</td>
                    </tr>
                </tfoot>
            </table>
        `);
    </script>

</body>
</html>
